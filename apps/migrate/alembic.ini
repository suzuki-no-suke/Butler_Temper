# Keep this file ASCII-only: on Windows, configparser reads it with the locale encoding (cp932).
# See migrate.py for details.

[main]
script_location = %(here)s/main
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[raw]
script_location = %(here)s/raw
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
